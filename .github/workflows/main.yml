<html style="margin:0;padding:0;">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
(function(){
  var s = document.createElement('style');
  s.textContent =
  ':root{--bg:#0d0d14;--card:#14141e;--text:#ffffff;--muted:#9a9ab0;--accent:#ffd700;--accent-soft:rgba(255,215,0,.14);--border:rgba(255,255,255,.14)}' +
  '.rainbow-wrap{padding:3px;border-radius:24px;background:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#00e676,#00b0ff,#7c4dff,#ff00e5,#ff004c);background-size:300% 100%;animation:rainbowFlow 5s linear infinite;box-shadow:0 0 34px rgba(124,77,255,.28)}' +
  '@keyframes rainbowFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}' +
  '.glossy{background:radial-gradient(ellipse 90% 55% at 50% -12%,rgba(255,255,255,.10),transparent 60%),linear-gradient(180deg,#181824,#0d0d14);border-radius:21px;position:relative;overflow:hidden}' +
  '.kv-input{width:54px;height:54px;text-align:center;font-size:22px;font-weight:600;border:2px solid var(--border);border-radius:12px;background:#1c1c28;color:#fff;outline:none;transition:border-color .2s,box-shadow .2s;font-family:"Source Sans 3",sans-serif}' +
  '.kv-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 18px rgba(255,215,0,.25)}' +
  '.kv-input::placeholder{color:rgba(255,255,255,.22)}' +
  '.kv-input.year{width:88px}' +
  '.kv-input.thu{width:54px}' +
  '.kv-label{font-size:12px;color:var(--muted);margin-top:6px;text-align:center;font-weight:600;letter-spacing:.05em}' +
  '.kv-field{display:flex;flex-direction:column;align-items:center}' +
  '.kv-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end}' +
  '.kv-sec{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);font-weight:700;margin-bottom:10px;text-align:center;text-shadow:0 0 12px rgba(255,215,0,.35)}' +
  '.fade-in{animation:fadeIn .45s ease forwards}' +
  '@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}' +
  '.kv-btn{background:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#00e676,#00b0ff,#7c4dff,#ff00e5);background-size:300% 100%;animation:rainbowFlow 5s linear infinite;color:#fff;border:none;padding:14px 44px;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:transform .15s,box-shadow .2s,opacity .2s;font-family:"Source Sans 3",sans-serif;box-shadow:0 4px 20px rgba(124,77,255,.4);text-shadow:0 1px 4px rgba(0,0,0,.4)}' +
  '.kv-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,176,255,.5)}' +
  '.kv-btn:active{transform:translateY(0)}' +
  '.kv-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}' +
  '.back-btn{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s;z-index:5;backdrop-filter:blur(6px)}' +
  '.back-btn:hover{background:rgba(255,255,255,.18);transform:translateX(-2px)}' +
  '.result-num{font-size:52px;font-weight:700;color:#fff;font-family:"Playfair Display",serif;line-height:1.1;letter-spacing:-.01em;text-shadow:0 0 30px rgba(255,215,0,.5),0 0 60px rgba(124,77,255,.35)}' +
  '.rainbow-bar{height:100%;width:0%;border-radius:5px;background:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#00e676,#00b0ff,#7c4dff);background-size:200% 100%;animation:rainbowFlow 3s linear infinite;transition:width 1.1s cubic-bezier(.22,1,.36,1)}' +
  '.ornament{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 22px}' +
  '.ornament .line{height:1px;width:44px;background:linear-gradient(90deg,transparent,#ffd700)}' +
  '.ornament .line.r{background:linear-gradient(90deg,#ffd700,transparent)}' +
  '.ornament .dot{width:6px;height:6px;background:linear-gradient(135deg,#ff004c,#7c4dff);transform:rotate(45deg);box-shadow:0 0 8px rgba(255,215,0,.6)}' +
  'h1.kv-title{font-family:"Playfair Display",serif;background:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#00e676,#00b0ff,#7c4dff,#ff00e5);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowFlow 4s linear infinite}' +
  '.notify-banner{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto;border-radius:10px;background:linear-gradient(90deg,rgba(255,0,76,.16),rgba(255,138,0,.16),rgba(255,230,0,.18),rgba(0,230,118,.16),rgba(0,176,255,.16),rgba(124,77,255,.16),rgba(255,0,229,.16));border:1px solid rgba(255,215,0,.45);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.04em;box-shadow:0 0 18px rgba(255,215,0,.3);overflow:hidden;max-height:0;opacity:0;transform:translateY(-8px);padding-top:0;padding-bottom:0;margin-bottom:0;transition:max-height .5s ease,opacity .4s ease,transform .4s ease,padding .4s ease,margin .4s ease}' +
  '.notify-banner.show{max-height:64px;opacity:1;transform:translateY(0);padding:9px 14px;margin-bottom:16px}' +
  '.nb-icon{color:#ffd700;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(255,215,0,.7))}' +
  '.fortune-frame{padding:2px;border-radius:18px;margin-top:4px;background:linear-gradient(135deg,#ffd700,#ff8a00,#ff004c,#7c4dff,#00b0ff,#00e676,#ffd700);background-size:300% 300%;animation:rainbowFlow 6s linear infinite;box-shadow:0 0 26px rgba(255,215,0,.22),0 0 50px rgba(124,77,255,.18)}' +
  '.fortune-inner{border-radius:16px;padding:22px 16px 18px;background:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(255,215,0,.10),transparent 60%),linear-gradient(180deg,#14141f,#0d0d16);position:relative;overflow:hidden}' +
  '.level-box{margin-top:18px;padding:14px 14px 12px;border-radius:12px;background:linear-gradient(180deg,rgba(255,215,0,.10),rgba(124,77,255,.08));border:1px solid rgba(255,215,0,.35);box-shadow:inset 0 0 20px rgba(255,215,0,.06),0 0 16px rgba(255,215,0,.12);position:relative}' +
  '.lb-corner{position:absolute;width:8px;height:8px;background:linear-gradient(135deg,#ffd700,#ff8a00);transform:rotate(45deg);box-shadow:0 0 8px rgba(255,215,0,.8)}' +
  '.lb-corner.tl{top:-4px;left:-4px}.lb-corner.tr{top:-4px;right:-4px}.lb-corner.bl{bottom:-4px;left:-4px}.lb-corner.br{bottom:-4px;right:-4px}' +
  '.level-label{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#ffd700;font-weight:700;margin-bottom:8px;text-shadow:0 0 10px rgba(255,215,0,.5)}' +
  '.level-text{font-size:14px;font-weight:600;color:#fff;line-height:1.75;letter-spacing:.02em;text-shadow:0 0 14px rgba(255,255,255,.2)}' +
  '.error-banner{display:none;align-items:center;justify-content:flex-start;gap:10px;margin:14px auto 0;max-width:360px;padding:12px 16px;border-radius:12px;background:linear-gradient(90deg,rgba(255,0,76,.22),rgba(255,138,0,.16),rgba(255,215,0,.12));border:1px solid rgba(255,107,107,.6);box-shadow:0 0 22px rgba(255,0,76,.32),inset 0 0 18px rgba(255,138,0,.12);color:#ffe0e0;font-size:13px;font-weight:700;letter-spacing:.03em;line-height:1.55;text-align:left}' +
  '.error-banner.show{display:flex;animation:errShake .5s ease}' +
  '.eb-icon{color:#ff6b6b;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(255,0,76,.8))}' +
  '@keyframes errShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(7px)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}' +
  '.load-frame{position:relative;width:100%;max-width:380px;padding:28px 22px 24px;border-radius:18px;text-align:center;background:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(255,215,0,.14),transparent 60%),linear-gradient(180deg,#161622,#0b0b13);border:1px solid rgba(255,215,0,.45);box-shadow:0 0 30px rgba(255,215,0,.28),0 0 60px rgba(124,77,255,.22);animation:loadPop .35s ease}' +
  '@keyframes loadPop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}' +
  '.load-spinner{width:42px;height:42px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:#ffd700;border-right-color:#ff004c;animation:spin .9s linear infinite;box-shadow:0 0 16px rgba(255,215,0,.45)}' +
  '@keyframes spin{to{transform:rotate(360deg)}}' +
  '.load-title{font-family:"Playfair Display",serif;font-size:17px;font-weight:700;color:#ffd700;letter-spacing:.08em;margin-bottom:14px;text-shadow:0 0 14px rgba(255,215,0,.55)}' +
  '.load-msg{min-height:118px;font-size:13px;font-weight:600;color:#fff;line-height:1.7;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;text-shadow:0 0 10px rgba(255,255,255,.2);white-space:normal;word-wrap:break-word;overflow:visible;animation:msgFade .5s ease}' +
  '@keyframes msgFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}' +
  '.load-aside{font-style:italic;color:#ffb07a;font-size:.92em;text-shadow:0 0 8px rgba(255,140,80,.4)}' +
  '.load-progress{margin-top:18px;height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}' +
  '.load-bar{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#ff004c,#ff8a00,#ffe600,#00e676,#00b0ff,#7c4dff);background-size:200% 100%;animation:rainbowFlow 3s linear infinite}' +
  '@media(max-width:380px){.result-num{font-size:38px}.kv-input{width:46px;height:48px;font-size:19px}.kv-input.year{width:72px}.load-msg{min-height:140px;font-size:12.5px}}';
  document.head.appendChild(s);
})();
</script>
<div style="background-color:transparent;box-sizing:border-box;">
  <div style="background:radial-gradient(ellipse 80% 50% at 50% 0%,#1a1a28,#07070c 70%);font-family:'Source Sans 3',sans-serif;color:var(--text)">
    <div style="max-width:520px;margin:0 auto;padding:36px 18px;">

      <div class="rainbow-wrap">
        <div class="glossy" style="padding:30px 22px 26px;">

          <button class="back-btn" id="backBtn" style="display:none" title="Quay lại">←</button>

          <!-- ===== INPUT VIEW ===== -->
          <div id="inputView">
            <h1 class="kv-title" style="font-size:27px;font-weight:700;text-align:center;margin:6px 0 2px;letter-spacing:.01em">Tính Khí Vận Hôm nay</h1>
            <div class="ornament"><span class="line"></span><span class="dot"></span><span class="line r"></span></div>

            <div style="margin-bottom:22px">
              <div class="kv-sec">Ngày Sinh</div>
              <div class="kv-row">
                <div class="kv-field"><input class="kv-input" id="d1" type="text" inputmode="numeric" maxlength="2" placeholder="--" data-max="31" data-pad="1"><div class="kv-label">Ngày</div></div>
                <div class="kv-field"><input class="kv-input" id="m1" type="text" inputmode="numeric" maxlength="2" placeholder="--" data-max="12" data-pad="1"><div class="kv-label">Tháng</div></div>
                <div class="kv-field"><input class="kv-input year" id="y1" type="text" inputmode="numeric" maxlength="4" placeholder="----"><div class="kv-label">Năm</div></div>
              </div>
            </div>

            <!-- ===== THỜI ĐIỂM (gộp Hôm Nay Là + Giờ Phút, bỏ Giây) ===== -->
            <div style="margin-bottom:26px">
              <div class="kv-sec">Thời Điểm</div>
              <div class="kv-row">
                <div class="kv-field"><input class="kv-input thu" id="thu" type="text" inputmode="numeric" maxlength="1" placeholder="2-8" data-min="2" data-max="8"><div class="kv-label">Thứ</div></div>
                <div class="kv-field"><input class="kv-input" id="d2" type="text" inputmode="numeric" maxlength="2" placeholder="--" data-max="31" data-pad="1"><div class="kv-label">Ngày</div></div>
                <div class="kv-field"><input class="kv-input" id="m2" type="text" inputmode="numeric" maxlength="2" placeholder="--" data-max="12" data-pad="1"><div class="kv-label">Tháng</div></div>
                <div class="kv-field"><input class="kv-input year" id="y2" type="text" inputmode="numeric" maxlength="4" placeholder="----"><div class="kv-label">Năm</div></div>
              </div>
              <div class="kv-row" style="margin-top:14px">
                <div class="kv-field"><input class="kv-input" id="gio" type="text" inputmode="numeric" maxlength="2" placeholder="--" data-max="23"><div class="kv-label">Giờ</div></div>
                <div class="kv-field"><input class="kv-input" id="phut" type="text" inputmode="numeric" maxlength="2" placeholder="--" data-max="59"><div class="kv-label">Phút</div></div>
              </div>
            </div>

            <div style="text-align:center">
              <button class="kv-btn" id="calcBtn">Đón Khí Vận</button>

              <div id="errorBanner" class="error-banner">
                <svg class="eb-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span id="errorText"></span>
              </div>
            </div>
          </div>

          <!-- ===== RESULT VIEW ===== -->
          <div id="resultView" style="display:none;text-align:center" class="fade-in">

            <div id="notifyBanner" class="notify-banner">
              <svg class="nb-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg>
              <span>Đón Khí Vận Thành Công — Thiên Cơ Đã Lộ</span>
              <svg class="nb-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg>
            </div>

            <h2 style="font-family:'Playfair Display',serif;font-size:23px;font-weight:700;color:#fff;margin:14px 0 4px;text-shadow:0 0 20px rgba(255,255,255,.2)">Kết Quả Khí Vận</h2>
            <div class="ornament"><span class="line"></span><span class="dot"></span><span class="line r"></span></div>

            <div class="fortune-frame">
              <div class="fortune-inner">

                <div style="margin-bottom:8px">
                  <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.2em;margin-bottom:10px;font-weight:600">Chỉ Số Khí Vận</div>
                  <div class="result-num" id="resultNum">—</div>
                </div>

                <div style="margin:22px 0 6px">
                  <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.2em;margin-bottom:12px;font-weight:600">Điểm Khí Vận (Tối đa 10)</div>
                  <div style="display:flex;align-items:center;justify-content:center;gap:12px">
                    <div style="flex:1;max-width:260px;height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.1)">
                      <div id="scoreBar" class="rainbow-bar"></div>
                    </div>
                    <div id="scoreText" style="font-size:20px;font-weight:700;color:var(--accent);min-width:56px;text-align:right;text-shadow:0 0 14px rgba(255,215,0,.5)">—</div>
                  </div>
                </div>

                <div class="level-box">
                  <span class="lb-corner tl"></span><span class="lb-corner tr"></span>
                  <span class="lb-corner bl"></span><span class="lb-corner br"></span>
                  <div class="level-label">— Sấm Văn —</div>
                  <div id="scoreLevel" class="level-text"></div>
                </div>

              </div>
            </div>

          </div>

          <!-- ===== MÀN HÌNH LOAD ===== -->
          <div id="loadOverlay" style="display:none;position:absolute;inset:0;z-index:20;background:rgba(7,7,12,.86);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;">
            <div class="load-frame">
              <div class="load-spinner"></div>
              <div class="load-title">Đang Dò Đọc Thiên Cơ</div>
              <div class="load-msg" id="loadMsg"></div>
              <div class="load-progress"><div id="loadBar" class="load-bar"></div></div>
            </div>
          </div>

        </div>
      </div>

      <p style="text-align:center;font-size:11px;color:rgba(255,255,255,.35);margin-top:16px;line-height:1.7">Công thức: (Ngày÷Tháng÷Năm sinh) + (Ngày÷Tháng÷Năm hôm nay) + Giờ÷Phút÷Thứ<br>Thứ nhập từ 2 đến 8 · Các trường để trống vẫn tính được</p>
    </div>
  </div>
</div>
<script>
(function(){
  function val(id){ var v = parseInt(document.getElementById(id).value, 10); return isNaN(v) ? 0 : v; }
  function str(id){ return document.getElementById(id).value; }

  var nbTimer = null, ebTimer = null;
  var loadTimer = null, loadActive = false;

  var LOAD_FULL = 7000, LOAD_HALF = 3500;

  var LOAD_MSGS = [
    'Đang Diễn Hoá Thực Tại Tương Lai Quá Khứ....',
    'Hệ Thống Đang Nhìn Lén Tiên cơ...',
    'Hệ Thống Đang Bị dí [//Đang bị Đánh//],..á.á..',
    'Hệ thống đang trộm vận may của Thiên Đạo... [//Á á á! Thiên Đạo cầm dao đuổi rồi, chạy mau Ký chủ ơi!//]...',
    'Đang phân tích bí pháp thượng cổ... [//Cảnh báo: Bí pháp này quá nhảm nhí, hệ thống chuẩn bị tự hủy!//]',
    '[//Cảnh báo đỏ//]: Lộ thiên cơ quá nhiều, hệ thống vừa bị Thiên Đạo phạt khóa tài khoản vĩnh viễn!',
    'Đang quét tìm đại cơ duyên... [//Tìm thấy: Một tờ vé số ế dưới cống ngầm, tỉ lệ trúng là 0.00001%.//]',
    'Hệ thống đang khóc ròng vì phải gánh một Ký chủ chuyên đi ngược lại với dòng chảy nhân quả...',
    'Hệ thống đang đột nhập vào kho tàng bí mật của Thiên Đạo... [//Phát hiện: Toàn rác và đồ phế thải, Khô mực!!! đang quay xe gấp!//]',
    '[Hệ thống] Đang solo 1-1 với Hệ thống Đại Gia hàng xóm... [//Á á á! Nó vả tao bằng một xấp thẻ đen quyền lực, đau quá Ký chủ cứu với!//]',
    'Đang vật lộn với Hệ thống Virus độc hại bên kia chiến tuyến... [//Cả hai đang lăn lộn dưới đất văng tục tĩu bằng mã nhị phân, không phân thắng bại!//]',
    'Phát hiện Hệ thống Lậu đang đạo văn bản quyền... [//Hai bên đang túm tóc, cấu xé nhau giữa dòng thời gian, hệ thống đang thắng thế nhờ chiêu... cắn lén!//]',
    'Đang đấu phép với Hệ thống "Trà Xanh" xuyên không... [//Bị nó dùng skill "Thảo Mai Tuyệt Kỹ" khóc lóc ré gọi hội đồng, hệ thống bị hội đồng đánh cho tím mặt!//]'
  ];

  function parseMsg(s){ return s.split('[//').join('<span class="load-aside">').split('//]').join('</span>'); }

  function showNotify(){
    var nb = document.getElementById('notifyBanner');
    nb.classList.remove('show');
    void nb.offsetWidth;
    setTimeout(function(){ nb.classList.add('show'); }, 60);
    if(nbTimer) clearTimeout(nbTimer);
    nbTimer = setTimeout(function(){ nb.classList.remove('show'); }, 5000);
  }
  function hideNotify(){
    var nb = document.getElementById('notifyBanner');
    nb.classList.remove('show');
    if(nbTimer) clearTimeout(nbTimer);
  }
  function showError(msg){
    var eb = document.getElementById('errorBanner');
    document.getElementById('errorText').textContent = msg;
    eb.classList.remove('show');
    void eb.offsetWidth;
    eb.classList.add('show');
    if(ebTimer) clearTimeout(ebTimer);
    ebTimer = setTimeout(function(){ eb.classList.remove('show'); }, 6000);
  }
  function hideError(){
    var eb = document.getElementById('errorBanner');
    eb.classList.remove('show');
    if(ebTimer) clearTimeout(ebTimer);
  }

  function startLoading(durationMs, onDone){
    loadActive = true;
    var ov = document.getElementById('loadOverlay');
    ov.style.display = 'flex';

    var bar = document.getElementById('loadBar');
    bar.style.transition = 'none';
    bar.style.width = '0%';
    void bar.offsetWidth;
    bar.style.transition = 'width ' + durationMs + 'ms linear';
    bar.style.width = '100%';

    // Random 1 câu duy nhất, giữ nguyên đến hết load
    var msgEl = document.getElementById('loadMsg');
    var picked = LOAD_MSGS[Math.floor(Math.random() * LOAD_MSGS.length)];
    msgEl.innerHTML = parseMsg(picked);

    loadTimer = setTimeout(function(){
      stopLoading();
      if(onDone) onDone();
    }, durationMs);
  }
  function stopLoading(){
    loadActive = false;
    if(loadTimer){ clearTimeout(loadTimer); loadTimer=null; }
    document.getElementById('loadOverlay').style.display = 'none';
  }
  function unlockBtn(){ document.getElementById('calcBtn').disabled = false; }

  // Bỏ giây: thứ tự tab chỉ còn 9 ô
  var order = ['d1','m1','y1','thu','d2','m2','y2','gio','phut'];
  order.forEach(function(id, idx){
    var el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', function(){
      hideError();
      this.value = this.value.replace(/[^0-9]/g,'');
      var max = parseInt(this.getAttribute('data-max'), 10);
      var min = parseInt(this.getAttribute('data-min'), 10);
      if(this.value !== ''){
        var v = parseInt(this.value, 10);
        if(!isNaN(max) && v > max){ this.value = String(max); }
        else if(!isNaN(min) && v < min){ this.value = ''; }
      }
      if(this.value.length >= this.maxLength && idx < order.length - 1){
        var nx = document.getElementById(order[idx+1]);
        if(nx) nx.focus();
      }
    });
    if(el.getAttribute('data-pad') === '1'){
      el.addEventListener('blur', function(){
        if(this.value !== '' && this.value.length === 1){
          this.value = '0' + this.value;
        }
      });
    }
    el.addEventListener('keydown', function(e){
      if(e.key === 'Backspace' && this.value === '' && idx > 0){
        var pv = document.getElementById(order[idx-1]);
        if(pv){ pv.focus(); e.preventDefault(); }
      }
    });
  });

  document.getElementById('calcBtn').addEventListener('click', function(){
    if(loadActive) return;
    hideError(); hideNotify();

    var y1s = str('y1'), y2s = str('y2');
    var forbidden = (y1s !== '' && val('y1') > 2026) || (y2s !== '' && val('y2') > 2026);

    var btn = document.getElementById('calcBtn');
    btn.disabled = true;

    if(forbidden){
      startLoading(LOAD_HALF, function(){
        showError('Không Thể Tiết Lộ Thiên Cơ! Hệ Thống Sẽ Bị Thiên Đạo Mạt Sát!');
        unlockBtn();
      });
      return;
    }

    startLoading(LOAD_FULL, function(){
      var d1=val('d1'), m1=val('m1'), y1=val('y1');
      var thu=val('thu');
      var d2=val('d2'), m2=val('m2'), y2=val('y2');
      var gio=val('gio'), phut=val('phut');

      // Công thức mới: (Ngày÷Tháng÷Năm sinh) + (Ngày÷Tháng÷Năm hôm nay) + Giờ÷Phút÷Thứ
      var part1 = d1 / (m1 || 1) / (y1 || 1);
      var part2 = d2 / (m2 || 1) / (y2 || 1);
      var part3 = gio / (phut || 1) / (thu || 1);

      var result = part1 + part2 + part3;

      var frac = result - Math.floor(result);
      var score = Math.min(10, Math.max(0, Math.round(frac * 30)));

      var level;
      if(score <= 2)      level = 'Khí vận mỏng manh như tơ, nên đóng cửa tàng hình, tu luyện âm thầm';
      else if(score <= 4) level = 'Khí vận vừa ngưng tụ, đạo tâm dần kiên định, tiến bước từ tốn';
      else if(score <= 6) level = 'Khí vận thành đan trong thân, vạn pháp tùy duyên, thuận gió thuận nước';
      else if(score <= 8) level = 'Khí vận hùng hậu chư thiên, cơ ngô tự đến, quý nhân tương trợ';
      else                level = 'Khí vận thông thiên, thiên cơ cộng hưởng, Đại Cát Đại Lợi, vô sự bất thành — Thiên Đạo Tương Trợ Không Sợ Vận Gì';

      document.getElementById('resultNum').textContent = result.toFixed(6);
      document.getElementById('scoreText').textContent = score + ' / 10';
      document.getElementById('scoreLevel').textContent = level;

      document.getElementById('inputView').style.display = 'none';
      document.getElementById('resultView').style.display = 'block';
      document.getElementById('backBtn').style.display = 'flex';
      showNotify();
      setTimeout(function(){ document.getElementById('scoreBar').style.width = (score * 10) + '%'; }, 180);
      unlockBtn();
    });
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('inputView').style.display = 'block';
    this.style.display = 'none';
    document.getElementById('scoreBar').style.width = '0%';
    hideNotify();
    hideError();
  });
})();
</script>
</html>
